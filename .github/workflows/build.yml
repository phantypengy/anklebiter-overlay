name: Build and release exe

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build exe
        run: pyinstaller --onedir --noconsole --noupx --collect-all pystray --name anklebiter-overlay main.py
      - name: Zip build folder
        run: Compress-Archive -Path dist\anklebiter-overlay\* -DestinationPath dist\anklebiter-overlay.zip
      - name: Create release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist/anklebiter-overlay.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}